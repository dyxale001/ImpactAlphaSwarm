[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -q --strict-markers
markers =
    smoke: one happy-path test per test file -- a thin slice through every feature, runs on every push (see TESTING.md, 'Tiers')
    core: money-path maths, ranking, personalisation and LLM guards -- runs on every pull request; the full suite runs on main and nightly (see TESTING.md, 'Tiers')
    live: reaches the real Supabase project through backend/.env -- passes locally, fails offline and in CI without secrets; excluded from the CI full tier with -m "not live"
    filterwarnings: built-in pytest marker, registered explicitly so --strict-markers accepts it under pytest 9
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
